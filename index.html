<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Movie Scribbles 🎬</title>
  
  <!-- Fonts & Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Patrick Hand', cursive;
      background-color: #f7f4ea;
      background-image: radial-gradient(#e2dcc8 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .font-scribble { font-family: 'Caveat', cursive; }
    .font-sans-ui { font-family: 'Quicksand', sans-serif; }

    /* Scribble / Paper Aesthetic Classes */
    .note-yellow {
      background: #fef08a;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      box-shadow: 3px 5px 12px rgba(0,0,0,0.08);
    }

    .note-blue {
      background: #bae6fd;
      border-radius: 20px 255px 20px 225px/255px 20px 225px 20px;
      box-shadow: 3px 5px 12px rgba(0,0,0,0.08);
    }

    .note-pink {
      background: #fbcfe8;
      border-radius: 255px 25px 225px 25px/25px 225px 25px 255px;
      box-shadow: 3px 5px 12px rgba(0,0,0,0.08);
    }

    .note-grid {
      background-color: #e0f2fe;
      background-image: linear-gradient(#38bdf8 1px, transparent 1px), linear-gradient(90deg, #38bdf8 1px, transparent 1px);
      background-size: 16px 16px;
      border-radius: 12px;
    }

    /* Washi Tape Effect */
    .tape-pink {
      background: rgba(244, 114, 182, 0.7);
      transform: rotate(-3deg);
    }
    .tape-striped {
      background: repeating-linear-gradient(45deg, #facc15, #facc15 10px, #f43f5e 10px, #f43f5e 20px);
      opacity: 0.8;
    }

    /* Hand-drawn strike-through */
    .strikethrough {
      text-decoration: line-through;
      text-decoration-color: #ef4444;
      text-decoration-thickness: 3px;
      opacity: 0.6;
    }

    /* Keyframes for handwriting feel */
    @keyframes scribbleDraw {
      0% { width: 0; }
      100% { width: 100%; }
    }
    .animate-scribble {
      overflow: hidden;
      white-space: nowrap;
      animation: scribbleDraw 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
  </style>
</head>
<body class="text-slate-800 min-h-screen pb-12">

  <!-- ================= PAGE 1: ENTRANCE / PROFILE ================= -->
  <div id="landingPage" class="fixed inset-0 z-50 flex items-center justify-center bg-[#f7f4ea] p-4">
    <div class="note-yellow max-w-md w-full p-8 relative transform -rotate-1 border-2 border-yellow-300">
      <!-- Washi tape decoration -->
      <div class="tape-pink absolute -top-4 left-1/2 -translate-x-1/2 w-32 h-8 rounded-sm shadow-sm"></div>

      <div class="text-center mt-4">
        <h1 class="font-scribble text-5xl font-bold text-slate-800 mb-2 animate-scribble mx-auto">
          Movie Scribbles ✨
        </h1>
        <p class="text-lg text-slate-600 mb-6">A shared notebook for movie & show recs.</p>

        <form id="profileForm" class="space-y-4">
          <div class="text-left">
            <label class="block text-xl font-semibold mb-1">What's your name?</label>
            <input 
              type="text" 
              id="userNameInput" 
              required
              placeholder="e.g., Alex..." 
              class="w-full p-3 bg-white/80 border-2 border-slate-700 rounded-xl font-sans-ui focus:outline-none focus:ring-2 focus:ring-pink-400"
            />
          </div>
          <button 
            type="submit" 
            class="w-full py-3 bg-rose-400 hover:bg-rose-500 text-white text-2xl font-bold rounded-xl shadow-md transition transform active:scale-95"
          >
            Enter Notebook ➔
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- ================= PAGE 2: MAIN DASHBOARD ================= -->
  <div id="mainDashboard" class="hidden max-w-6xl mx-auto px-4 pt-6">
    
    <!-- Top Bar -->
    <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
      <div class="relative">
        <h1 class="font-scribble text-5xl font-bold text-slate-900 tracking-wide">
          Movie Scribbles ✏️
        </h1>
        <div class="tape-striped absolute -top-3 -left-6 w-20 h-5 transform -rotate-12"></div>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xl">Hey, <b id="displayUsername" class="text-rose-600 font-scribble text-2xl"></b>!</span>
        <button onclick="changeProfile()" class="text-xs font-sans-ui bg-slate-200 hover:bg-slate-300 px-3 py-1 rounded-full transition active:scale-95">Switch Profile</button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- LEFT COLUMN: Add Rec + My Watchlist -->
      <div class="space-y-8">
        
        <!-- Form Note (Add Rec) -->
        <div class="note-pink p-6 relative border-2 border-pink-300">
          <div class="tape-pink absolute -top-3 right-8 w-24 h-6"></div>
          <h2 class="font-scribble text-3xl font-bold mb-4">Add Recommendation 📌</h2>
          
          <form id="addRecForm" class="space-y-3 font-sans-ui text-sm">
            <div>
              <input type="text" id="titleInput" placeholder="Title (e.g. Severance)" required class="w-full p-2 rounded-lg border border-pink-300 focus:outline-none" />
            </div>
            
            <div class="grid grid-cols-2 gap-2">
              <select id="categoryInput" class="p-2 rounded-lg border border-pink-300 focus:outline-none">
                <option value="Movie">🎬 Movie</option>
                <option value="TV Show">📺 TV Show</option>
              </select>
              
              <select id="genreInput" class="p-2 rounded-lg border border-pink-300 focus:outline-none">
                <option value="Sci-Fi">Sci-Fi</option>
                <option value="Drama">Drama</option>
                <option value="Comedy">Comedy</option>
                <option value="Horror">Horror</option>
                <option value="Action">Action</option>
                <option value="Romance">Romance</option>
                <option value="Thriller">Thriller</option>
                <option value="Animation">Animation</option>
              </select>
            </div>

            <div>
              <input type="text" id="platformInput" placeholder="Where to watch? (e.g. Netflix, Apple TV)" required class="w-full p-2 rounded-lg border border-pink-300 focus:outline-none" />
            </div>

            <button type="submit" class="w-full font-scribble text-2xl bg-slate-800 text-white py-2 rounded-lg hover:bg-slate-700 transition active:scale-95">
              Scribble It Down!
            </button>
          </form>
        </div>

        <!-- Personal Watchlist Note -->
        <div class="note-grid p-6 relative border-2 border-sky-300">
          <div class="tape-pink absolute -top-3 left-6 w-20 h-6"></div>
          <h2 class="font-scribble text-3xl font-bold mb-2">My Personal Watchlist 📝</h2>
          <p class="text-xs font-sans-ui text-slate-600 mb-4">Tick items off as you watch them!</p>

          <ul id="personalWatchlist" class="space-y-2 text-lg">
            <!-- Dynamic Items -->
          </ul>
        </div>

      </div>

      <!-- RIGHT COLUMN: Shared Repository Feed -->
      <div class="lg:col-span-2 space-y-6">
        
        <!-- Filter Controls -->
        <div class="flex flex-wrap items-center justify-between gap-2 bg-white/60 p-4 rounded-2xl border-2 border-dashed border-slate-300">
          <span class="font-bold text-lg">Filter by Genre:</span>
          <div id="genreFilters" class="flex flex-wrap gap-2 font-sans-ui text-xs">
            <button data-genre="All" class="genre-btn bg-slate-800 text-white px-3 py-1 rounded-full transition active:scale-95">All</button>
            <button data-genre="Sci-Fi" class="genre-btn bg-white text-slate-800 border px-3 py-1 rounded-full transition active:scale-95">Sci-Fi</button>
            <button data-genre="Drama" class="genre-btn bg-white text-slate-800 border px-3 py-1 rounded-full transition active:scale-95">Drama</button>
            <button data-genre="Comedy" class="genre-btn bg-white text-slate-800 border px-3 py-1 rounded-full transition active:scale-95">Comedy</button>
            <button data-genre="Horror" class="genre-btn bg-white text-slate-800 border px-3 py-1 rounded-full transition active:scale-95">Horror</button>
            <button data-genre="Action" class="genre-btn bg-white text-slate-800 border px-3 py-1 rounded-full transition active:scale-95">Action</button>
            <button data-genre="Romance" class="genre-btn bg-white text-slate-800 border px-3 py-1 rounded-full transition active:scale-95">Romance</button>
            <button data-genre="Thriller" class="genre-btn bg-white text-slate-800 border px-3 py-1 rounded-full transition active:scale-95">Thriller</button>
            <button data-genre="Animation" class="genre-btn bg-white text-slate-800 border px-3 py-1 rounded-full transition active:scale-95">Animation</button>
          </div>
        </div>

        <!-- Recs List Container -->
        <div id="recsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Dynamic Recommendation Cards will go here -->
        </div>

      </div>

    </div>
  </div>

  <!-- ================= JAVASCRIPT & FIREBASE ================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // FIXME: Replace with your actual Firebase Project Configuration
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const recsRef = collection(db, "recommendations");

    // Local State Variables
    let currentUser = localStorage.getItem("scribble_username") || "";
    let activeFilter = "All";
    let allRecs = [];
    let personalWatchlist = JSON.parse(localStorage.getItem("scribble_watchlist") || "[]");

    // DOM Elements
    const landingPage = document.getElementById("landingPage");
    const mainDashboard = document.getElementById("mainDashboard");
    const profileForm = document.getElementById("profileForm");
    const userNameInput = document.getElementById("userNameInput");
    const displayUsername = document.getElementById("displayUsername");
    const addRecForm = document.getElementById("addRecForm");
    const recsContainer = document.getElementById("recsContainer");
    const personalWatchlistEl = document.getElementById("personalWatchlist");
    const genreFilters = document.getElementById("genreFilters");

    // Init App State
    function init() {
      if (currentUser) {
        landingPage.classList.add("hidden");
        mainDashboard.classList.remove("hidden");
        displayUsername.textContent = currentUser;
        listenForRecs();
        renderPersonalWatchlist();
      } else {
        landingPage.classList.remove("hidden");
        mainDashboard.classList.add("hidden");
      }
    }

    // Profile Setup
    profileForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = userNameInput.value.trim();
      if (name) {
        currentUser = name;
        localStorage.setItem("scribble_username", name);
        init();
      }
    });

    window.changeProfile = () => {
      localStorage.removeItem("scribble_username");
      location.reload();
    };

    // Add Recommendation to Firebase
    addRecForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = document.getElementById("titleInput").value.trim();
      const category = document.getElementById("categoryInput").value;
      const genre = document.getElementById("genreInput").value;
      const platform = document.getElementById("platformInput").value.trim();

      if (!title || !platform) return;

      try {
        await addDoc(recsRef, {
          title,
          category,
          genre,
          platform,
          addedBy: currentUser,
          createdAt: serverTimestamp()
        });
        addRecForm.reset();
      } catch (err) {
        console.error("Error adding document: ", err);
      }
    });

    // Real-time Firebase Listener
    function listenForRecs() {
      const q = query(recsRef, orderBy("createdAt", "desc"));
      onSnapshot(q, (snapshot) => {
        allRecs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderRecs();
      });
    }

    // Smooth Filter Switching Logic
    genreFilters.addEventListener("click", (e) => {
      const btn = e.target.closest(".genre-btn");
      if (!btn) return;

      document.querySelectorAll(".genre-btn").forEach(b => {
        b.classList.remove("bg-slate-800", "text-white");
        b.classList.add("bg-white", "text-slate-800");
      });
      btn.classList.remove("bg-white", "text-slate-800");
      btn.classList.add("bg-slate-800", "text-white");

      activeFilter = btn.getAttribute("data-genre");
      renderRecs();
    });

    // Render Recommendations
    function renderRecs() {
      recsContainer.innerHTML = "";

      const filtered = (activeFilter === "All" || !activeFilter)
        ? allRecs 
        : allRecs.filter(r => r.genre && r.genre.toLowerCase() === activeFilter.toLowerCase());

      if (filtered.length === 0) {
        recsContainer.innerHTML = `<p class="text-center col-span-2 text-xl font-scribble text-slate-500 py-8">No recommendations found here yet! Add one on the left ✍️</p>`;
        return;
      }

      const fragment = document.createDocumentFragment();

      filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = "note-yellow p-5 relative border border-yellow-300 flex flex-col justify-between transition-all duration-150 transform hover:-translate-y-1 shadow-sm";
        
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start gap-2 mb-2">
              <span class="text-xs font-sans-ui bg-amber-200 text-amber-900 px-2 py-0.5 rounded-md font-bold uppercase">
                ${item.category}
              </span>
              <span class="text-xs font-sans-ui bg-rose-100 text-rose-800 px-2 py-0.5 rounded-full font-semibold">
                🏷️ ${item.genre}
              </span>
            </div>
            
            <h3 class="font-scribble text-3xl font-bold text-slate-900 leading-none mb-1">${item.title}</h3>
            <p class="font-sans-ui text-sm text-slate-700">📺 Watch on: <b>${item.platform}</b></p>
          </div>

          <div class="mt-4 pt-3 border-t border-yellow-400/50 flex justify-between items-center text-xs font-sans-ui">
            <span class="text-slate-600">Added by: <b>${item.addedBy}</b></span>
            
            <div class="flex gap-2">
              <button data-action="add-watchlist" data-title="${escapeHtml(item.title)}" class="hover:bg-amber-300 px-2 py-1 rounded transition active:scale-95" title="Add to My Watchlist">
                ➕ Watchlist
              </button>
              <button data-action="delete" data-id="${item.id}" class="text-rose-600 hover:bg-rose-200 px-2 py-1 rounded transition active:scale-95" title="Delete">
                🗑️
              </button>
            </div>
          </div>
        `;
        fragment.appendChild(card);
      });

      recsContainer.appendChild(fragment);
    }

    // Delegated Event Listener for Card Actions
    recsContainer.addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-action]");
      if (!btn) return;

      const action = btn.getAttribute("data-action");

      if (action === "delete") {
        const id = btn.getAttribute("data-id");
        if (confirm("Delete this recommendation?")) {
          await deleteDoc(doc(db, "recommendations", id));
        }
      } else if (action === "add-watchlist") {
        const title = btn.getAttribute("data-title");
        addToPersonalWatchlist(title);
      }
    });

    function escapeHtml(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // Personal Watchlist Functions
    function addToPersonalWatchlist(title) {
      if (!personalWatchlist.some(i => i.title === title)) {
        personalWatchlist.push({ title, completed: false });
        savePersonalWatchlist();
      }
    }

    function savePersonalWatchlist() {
      localStorage.setItem("scribble_watchlist", JSON.stringify(personalWatchlist));
      renderPersonalWatchlist();
    }

    function renderPersonalWatchlist() {
      personalWatchlistEl.innerHTML = "";
      if (personalWatchlist.length === 0) {
        personalWatchlistEl.innerHTML = `<li class="text-sm font-sans-ui text-slate-500">Your watchlist is empty! Click "+ Watchlist" on any movie card to add it here.</li>`;
        return;
      }

      const fragment = document.createDocumentFragment();

      personalWatchlist.forEach((item, idx) => {
        const li = document.createElement("li");
        li.className = "flex items-center justify-between gap-2 border-b border-sky-200/60 pb-1";
        li.innerHTML = `
          <label class="flex items-center gap-2 cursor-pointer flex-1">
            <input type="checkbox" data-idx="${idx}" ${item.completed ? 'checked' : ''} class="wl-toggle rounded text-sky-600 focus:ring-0">
            <span class="${item.completed ? 'strikethrough text-slate-400' : 'text-slate-800'} font-scribble text-2xl leading-none">
              ${item.title}
            </span>
          </label>
          <button data-idx="${idx}" class="wl-remove text-xs text-rose-500 hover:text-rose-700 font-sans-ui px-1">✕</button>
        `;
        fragment.appendChild(li);
      });

      personalWatchlistEl.appendChild(fragment);
    }

    personalWatchlistEl.addEventListener("click", (e) => {
      if (e.target.classList.contains("wl-remove")) {
        const idx = parseInt(e.target.getAttribute("data-idx"), 10);
        personalWatchlist.splice(idx, 1);
        savePersonalWatchlist();
      }
    });

    personalWatchlistEl.addEventListener("change", (e) => {
      if (e.target.classList.contains("wl-toggle")) {
        const idx = parseInt(e.target.getAttribute("data-idx"), 10);
        personalWatchlist[idx].completed = e.target.checked;
        savePersonalWatchlist();
      }
    });

    // Run App
    init();
  </script>
</body>
</html>
